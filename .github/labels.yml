- name: "status:blocked-upstream"
  color: "fbca04"
  description: "Blocked on an upstream (dependency / build system / OS) issue"
- name: "status:confirmed"
  color: "fbca04"
  description: "Reproduced and confirmed by maintainers"
- name: "status:needs-info"
  color: "fbca04"
  description: "Waiting for more info (version, logs, build command)"
- name: "status:needs-investigation"
  color: "fbca04"
  description: "Cause unknown, needs digging"
- name: "status:needs-repro"
  color: "fbca04"
  description: "Waiting for a reproducible example"
- name: "status:wontfix"
  from_name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on"

- name: "build"
