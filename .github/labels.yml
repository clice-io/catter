# Single source of truth for repository labels.
# Synced to GitHub automatically when this file changes on main (see workflows/lint.yml).
# To rename a label without losing its issue associations, add `from_name: <old>`.
# NOTE: when changing `area:` labels, also update the "Related area" dropdown
# in ISSUE_TEMPLATE/{bug_report,feature_request}.yml.

- name: "kind:bug"
  from_name: "bug"
  color: "d73a4a"
  description: "Something doesn't work as expected"
- name: "kind:crash"
  color: "b60205"
  description: "catter crashes, hangs, or breaks the intercepted build"
- name: "kind:discussion"
  color: "c5def5"
  description: "Open-ended design or direction discussion"
- name: "kind:docs"
  from_name: "documentation"
  color: "0075ca"
  description: "Documentation issue or improvement"
- name: "kind:feature-request"
  from_name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement request"
- name: "kind:performance"
  color: "d93f0b"
  description: "Slowness, high memory or CPU usage"
- name: "kind:question"
  from_name: "question"
  color: "d876e3"
  description: "Usage question or help request"

- name: "area:hook"
  color: "1d76db"
  description: "Process interception (catter-hook, LD_PRELOAD / DYLD / DLL injection)"
- name: "area:proxy"
  color: "1d76db"
  description: "catter-proxy and command forwarding"
- name: "area:ipc"
  color: "1d76db"
  description: "Communication between catter, the hook and the proxy"
- name: "area:cli"
  color: "1d76db"
  description: "Command-line interface and options"
- name: "area:script-api"
  color: "1d76db"
  description: "JavaScript runtime and the catter script API"
- name: "area:cdb"
  color: "1d76db"
  description: "Compilation database generation (script::cdb)"
- name: "area:compiler-args"
  color: "1d76db"
  description: "Compiler identification and argument parsing"
- name: "area:replay"
  color: "1d76db"
  description: "Recording and replaying captured builds"

- name: "os:linux"
  color: "0e8a16"
  description: "Happens on Linux"
- name: "os:macos"
  color: "0e8a16"
  description: "Happens on macOS"
- name: "os:windows"
  color: "0e8a16"
  description: "Happens on Windows"
- name: "os:wsl"
  color: "0e8a16"
  description: "Happens under WSL (Windows Subsystem for Linux)"

- name: "compiler:gcc"
  color: "8250df"
