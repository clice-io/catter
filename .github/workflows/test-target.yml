name: test-target

# One target and build type: a build job, then the unit tests and the cases
# in jobs of their own that wait for this build only, never for another
# target's. They run on the programs the build uploads, on a runner that did
# not build them, as a user runs catter. A cross build (build_os) builds on
# a faster runner, with xclang's toolchain for the target.

on:
  workflow_call:
    inputs:
      # The runner the suites run on, and the build unless build_os is set.
      os:
        required: true
        type: string
      build_os:
        type: string
        default: ""
      # The triple of the target: the platform of a cross build, and the
      # name of the artifacts, the caches and the release package.
      target:
        required: true
        type: string
      build_type:
        type: string
        default: RelWithDebInfo
      # Builds the release package of this target, which releases promote
      # once the run is green (publish.yml).
      package:
        type: boolean
        default: false
      # The shards the cases split into, each "i/n", as a JSON array.
      cases_shards:
        type: string
        default: '["1/1"]'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.build_os || inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi

      # Pull requests only restore: every push saving its own copy churns
      # the repository's cache pool faster than the next run can reuse it.
      # Saved from main below, once per merge. Every input of an action, the
      # toolchain's files among them, is in its key, so nothing else needs to
      # be in the cache's.
      - name: Restore Bazel caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ inputs.target }}-${{ inputs.build_type }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ inputs.target }}-${{ inputs.build_type }}-

      # Bazel refuses a repository cache inside the workspace. On main every
      # cached output is fetched, which marks it used for the prune below;
      # elsewhere only what is asked for. agent-box.yml, on the agent-box
      # branch, writes the same.
      - name: Bazel settings
        shell: bash
        run: |
          {
            echo "common --disk_cache=$RUNNER_TEMP/bazel-disk"
            echo "common --repository_cache=$RUNNER_TEMP/bazel-repo"
            echo "build --profile=$RUNNER_TEMP/bazel-profile.json.gz"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "common --remote_download_all"
            fi
          } > user.bazelrc
          touch "$RUNNER_TEMP/bazel-start"

      # A packaged target builds its release archives along: the programs in
      # them are the ones the suites run.
      - name: Build
        timeout-minutes: 60
        run: >-
          pixi run -e dev build ${{ inputs.build_type }} --
          ${{ inputs.build_os && format('--platforms=@xclang//platforms:{0}', inputs.target) || '' }}
          ${{ inputs.package && '//:package //:symbols' || '' }}

      # Where the build's time went: each action on its critical path, in
      # seconds. The artifact is the whole timeline, for Perfetto.
      - name: Critical path
        shell: bash
        run: |
          gzip -dc "$RUNNER_TEMP/bazel-profile.json.gz" |
            jq -r '.traceEvents[] | select(.cat == "critical path component") | "\((.dur / 1e5 | floor) / 10)\t\(.name)"'

      - name: Upload build profile
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-${{ inputs.target }}-${{ inputs.build_type }}
          path: ${{ runner.temp }}/bazel-profile.json.gz
          if-no-files-found: error
          retention-days: 7

      # Bazel refreshes an entry's mtime when it reads it, so what this run
      # did not touch is what the current tree no longer needs.
      - name: Prune the disk cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          find "$RUNNER_TEMP/bazel-disk" -type f ! -newer "$RUNNER_TEMP/bazel-start" -delete
          du -sh "$RUNNER_TEMP"/bazel-disk "$RUNNER_TEMP"/bazel-repo

      - name: Save Bazel caches
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ inputs.target }}-${{ inputs.build_type }}-${{ github.sha }}

      # The schema and the SDKs' types generated from it must be the ones
      # the programs give, the same on every target: one checks.
      - name: Check the protocol
        if: ${{ inputs.target == 'x86_64-unknown-linux-gnu' && inputs.build_type == 'RelWithDebInfo' }}
        run: pixi run -e dev check-protocol

      - name: Check the package's dependencies
        if: ${{ inputs.package }}
        shell: bash
        run: pixi run -e dev python scripts/check_artifact_deps.py build/${{ inputs.build_type }}/bin/catter.${{ contains(inputs.target, 'mingw') && 'zip' || 'tar.gz' }}

      # The programs and payloads side by side, as catter finds them, with
      # the unit tests. A failed shard can be rerun alone while it lives.
      - name: Upload programs
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.target }}-${{ inputs.build_type }}
          path: |
            build/${{ inputs.build_type }}/bin/bin/
            !build/${{ inputs.build_type }}/bin/bin/bin
            !build/${{ inputs.build_type }}/bin/bin/*.gsym*
            !build/${{ inputs.build_type }}/bin/bin/*.params
            !build/${{ inputs.build_type }}/bin/bin/*.stripped
          if-no-files-found: error
          retention-days: 3

      # These artifacts are what releases promote — there is no separate
      # release build — once the whole run is green.
      - name: Upload package
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ inputs.target }}
          path: |
            build/${{ inputs.build_type }}/bin/catter.tar.gz
            build/${{ inputs.build_type }}/bin/catter.zip
            build/${{ inputs.build_type }}/bin/catter-symbol.tar.xz
            build/${{ inputs.build_type }}/bin/catter-symbol.zip
          if-no-files-found: error
          # 30 days bounds how old a commit a tag can still promote.
          retention-days: 30

  unit:
    needs: build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-programs
        with:
          target: ${{ inputs.target }}
          build_type: ${{ inputs.build_type }}

      - name: Unit tests
        timeout-minutes: 10
        run: pixi run -e dev unit-test ${{ inputs.build_type }}

  # The cases under tests/ (tests/README.md).
  cases:
    needs: build
    name: cases ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.cases_shards) }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # xmake is one of the build systems the cases build with.
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.8
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: ${{ inputs.os }}

      - uses: ./.github/actions/download-programs
        with:
          target: ${{ inputs.target }}
          build_type: ${{ inputs.build_type }}

      # In the job's default shell: on Windows not Git Bash, whose MSYS
      # environment changes how build tools behave.
      - name: Cases
        timeout-minutes: 20
        run: pixi run -e dev cases-test ${{ inputs.build_type }} ${{ matrix.shard }}
