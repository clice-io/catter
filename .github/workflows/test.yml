name: test

# Every target and build type CI builds, each in test-target.yml. The Windows
# targets build on Linux, whose runners build them several times faster, and
# run their suites on Windows.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-x64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      package: true

  linux-x64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      build_type: Debug

  macos-arm64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      package: true

  macos-arm64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      build_type: Debug

  windows-x64:
    uses: ./.github/workflows/test-target.yml
    with:
      build_os: ubuntu-24.04
      os: windows-2025
      target: x86_64-w64-mingw32
      package: true

  windows-x64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      build_os: ubuntu-24.04
      os: windows-2025
      target: x86_64-w64-mingw32
      build_type: Debug

  # The cases' programs are x64 (vcvars64) and the system's arm64, so the
  # build's processes mix both hook DLLs. Windows on ARM has no ASan, so no
  # Debug build.
  windows-arm64:
    uses: ./.github/workflows/test-target.yml
    with:
      build_os: ubuntu-24.04
      os: windows-11-arm
      target: aarch64-w64-mingw32
      package: true
