name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-x64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      package: package-ubuntu-24.04

  linux-x64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      mode: debug

  macos-arm64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      package: package-macos-15

  macos-arm64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      mode: debug

  # Windows built with xclang for MinGW.
  windows-x64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: windows-2025
      target: x86_64-w64-mingw32
      package: package-windows-2025-mingw

  windows-x64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: windows-2025
      target: x86_64-w64-mingw32
      mode: debug

  # Cross-built on x64, a faster machine than the Windows on ARM runner. The
  # cases' programs are x64 (vcvars64) and the system's arm64, so the build's
  # processes mix both hook DLLs.
  windows-arm64:
    uses: ./.github/workflows/test-target.yml
    with:
      build_os: windows-2025
      os: windows-11-arm
      target: aarch64-w64-mingw32
      package: package-windows-11-arm-mingw
