name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-x64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      package: package-ubuntu-24.04

  linux-x64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      mode: debug

  macos-arm64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      package: package-macos-15

  macos-arm64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      mode: debug

  windows-x64:
    uses: ./.github/workflows/test-target.yml
    with:
      os: windows-2025
      target: x86_64-pc-windows-msvc
      package: package-windows-2025

  windows-x64-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: windows-2025
      target: x86_64-pc-windows-msvc
      mode: debug

  # Windows built with xclang for MinGW.
  windows-x64-mingw:
    uses: ./.github/workflows/test-target.yml
    with:
      os: windows-2025
      target: x86_64-w64-mingw32
      env: mingw
      package: package-windows-2025-mingw

  windows-x64-mingw-debug:
    uses: ./.github/workflows/test-target.yml
    with:
      os: windows-2025
      target: x86_64-w64-mingw32
      env: mingw
      mode: debug
