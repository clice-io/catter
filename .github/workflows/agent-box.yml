# Installed by `box install`, which later only moves the agent-box pin. Add whatever setup the
# box should start with before the last step: the checkout, toolchain and cache restore steps of
# this repo's CI, so a box builds where and how CI does.
name: agent-box
run-name: agent-box ${{ inputs.lease }}
on:
  push:
    branches: [agent-box]
  workflow_dispatch:
    inputs:
      lease:
        required: true
      pubkey:
        required: true
      minutes:
        default: "340"
      os:
        type: choice
        default: linux
        options: [linux, linux-arm, macos, macos-intel, windows, windows-arm]
permissions:
  contents: read
jobs:
  box:
    if: github.event_name == 'workflow_dispatch' && github.actor == '16bit-ykiko' && github.triggering_actor == '16bit-ykiko'
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","linux-arm":"ubuntu-24.04-arm","macos":"macos-15","macos-intel":"macos-15-intel","windows":"windows-2025","windows-arm":"windows-11-arm"}')[inputs.os] || 'ubuntu-24.04' }}
    timeout-minutes: 350
    # The runner image CI names its caches by, and the target CI builds there, which names its
    # package caches (none on the runners CI builds nothing on).
    env:
      CI_OS: ${{ fromJSON('{"linux":"ubuntu-24.04","linux-arm":"ubuntu-24.04-arm","macos":"macos-15","macos-intel":"macos-15-intel","windows":"windows-2025","windows-arm":"windows-11-arm"}')[inputs.os] || 'ubuntu-24.04' }}
      CI_TARGET: ${{ fromJSON('{"linux":"x86_64-unknown-linux-gnu","macos":"aarch64-apple-darwin","windows":"x86_64-w64-mingw32"}')[inputs.os] || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      # No cache inputs: setup-xmake saves its caches when the job ends, and the cache quota is
      # CI's. The package cache is restored below instead.
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.8

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.71.1
          environments: dev
          activate-environment: false
          cache: true
          cache-write: false
          locked: true
          post-cleanup: false

      # Restore only; CI saves. The newest debug entry of the target CI builds on this OS: what
      # the packages lack, configure builds.
      - name: Restore xmake packages
        if: env.CI_TARGET != ''
        uses: actions/cache/restore@v6
        with:
          path: .xmake-package-cache
          key: xmake-package-cache-${{ env.CI_TARGET }}-debug-pixi-
          restore-keys: xmake-package-cache-${{ env.CI_TARGET }}-debug-pixi-
      - name: Install xmake packages
        if: env.CI_TARGET != ''
        shell: pwsh
        run: |
          if (Test-Path .xmake-package-cache) {
            $dir = (xmake l -c 'import("core.package.package"); print(package.installdir())' | Out-String).Trim()
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item -Recurse -Force .xmake-package-cache/* $dir
            Remove-Item -Recurse -Force .xmake-package-cache
          }

      - name: Notes
        shell: bash
        run: |
          mkdir -p ~/.box
          {
            echo 'Build and test as CI does: pixi run -e dev ci-build debug (or release).'
            if [ "$RUNNER_OS" = Windows ]; then
              echo 'Windows on ARM is cross-built on x64 Windows: pixi run -e dev ci-cross-build release.'
              echo 'Git Bash makes xmake take the host for MSYS, and unsetting MSYSTEM there does not help:'
              echo 'run pixi and xmake through PowerShell, e.g. pwsh -NoProfile -Command "Remove-Item Env:MSYSTEM -EA 0; pixi run -e dev ci-build debug".'
            fi
          } > ~/.box/notes

      - uses: 16bit-ykiko/agent-box@1d433bb4c6ac84e877e2f9861b72fd251adee496
        with:
          pubkey: ${{ inputs.pubkey }}
          minutes: ${{ inputs.minutes }}
