name: "Setup Pixi"
description: "setup pixi"

inputs:
  environments:
    description: "The pixi environments to install (space-separated, e.g. 'dev clang')"
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.9.6
      with:
        pixi-version: v0.71.1
        environments: ${{ inputs.environments }}
        # Tasks select their environment explicitly (`pixi run -e dev ...`).
        activate-environment: false
        # Restoring an environment beats installing it from the CDN, most on
        # Windows. Saved from main only, as the build cache is (test-target.yml).
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        locked: true
        # Runners are thrown away after the job.
        post-cleanup: false
