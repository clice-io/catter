name: "Setup Pixi"
description: "setup pixi"

inputs:
  environments:
    description: "The pixi environments to install (space-separated, e.g. 'dev clang')"
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.9.6
      with:
        pixi-version: v0.71.1
        environments: ${{ inputs.environments }}
        # Tasks select their environment explicitly (`pixi run -e dev ...`).
        activate-environment: false
        cache: true
        locked: true
