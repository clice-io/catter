# tombi: format.rules.table-keys-order.disabled = true
[workspace]
name = "catter"
version = "0.0.1"
description = "A new tool to capture C++ compilation command"
authors = [
    "star9029 <hengxing9029@outlook.com>",
    "clice contributors <clice@clice.io>",
]
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://clice.io"
repository = "https://github.com/clice-io/catter"
channels = ["conda-forge", "https://conda.clice.io"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
pnpm = "*"
# The LLVM tools the artifact check runs (scripts/check_artifact_deps.py), of
# the xclang release MODULE.bazel builds with (clice-io/xclang).
xclang = "==23.1.3.4"

# The compilers the cases build with on Linux (tests/builds).
[target.linux-64.dependencies]
sysroot_linux-64 = "==2.17"
gcc = "==14.2.0"
gxx = "==14.2.0"

[feature.dev.dependencies]
python = ">=3.14.2,<3.15"
nodejs = "==24.4.0"
# The build systems the cases build with (tests/builds), pinned so that
# their output reads the same on every machine.
cmake = "==4.1.2"
ninja = "==1.13.1"

[feature.dev.tasks]
check-doc-translations = "node tools/docs/translations.ts check"
report-doc-translations = "node tools/docs/translations.ts report"
record-doc-translations = "node tools/docs/translations.ts record"
review-doc-translations = "node tools/docs/translations.ts review --glossary=.claude/skills/translate-docs/SKILL.md"

# The unit tests of a build type, on its programs (`build`), with no
# arguments, as CI runs them.
[feature.dev.tasks.unit-test]
args = [{ arg = "type", choices = ["Debug", "RelWithDebInfo"], default = "RelWithDebInfo" }]
cmd = "build/{{ type }}/bin/bin/unittests && build/{{ type }}/bin/bin/unittests-hook-unix"

# The cases under tests/ (tests/README.md), against the catter of a build
# type, or shard i of n of them.
[feature.dev.tasks.cases-test]
args = [
    { arg = "type", choices = ["Debug", "RelWithDebInfo"], default = "RelWithDebInfo" },
    { arg = "shard", default = "1/1" },
]
cmd = """CATTER_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/bin/catter \
CATTER_CASES_SHARD={{ shard }} pnpm --dir tests run cases"""
depends-on = ["npm-install"]

# Build a type, then run the unit tests and the cases on it.
[feature.dev.tasks.test]
args = [{ arg = "type", choices = ["Debug", "RelWithDebInfo"], default = "RelWithDebInfo" }]
depends-on = [
    { task = "build", args = ["{{ type }}"] },
    { task = "unit-test", args = ["{{ type }}"] },
    { task = "cases-test", args = ["{{ type }}"] },
]

[feature.dev.target.win-64.tasks.unit-test]
args = [{ arg = "type", choices = ["Debug", "RelWithDebInfo"], default = "RelWithDebInfo" }]
cmd = "build/{{ type }}/bin/bin/unittests.exe && build/{{ type }}/bin/bin/unittests-hook-windows.exe"

# ============================================================================== #
#                                    FORMAT                                      #
# ============================================================================== #
[feature.format.dependencies]
ruff = "*"
tombi = "==1.8.5"
fd-find = "*"
prettier = "*"
clang-format = "==23.1.1"

[feature.format.tasks]
format-cpp = "fd -H -e cpp -e h -e cc -e hpp -X clang-format -i"
format-python = "ruff format ."
# prettier expands its own globs: on Windows it is a .bat, which fd -X
# cannot start.
format-web = "prettier --write '**/*.{js,mjs,ts,css}'"
format-markdown = "prettier --write '**/*.md'"
format-json = "prettier --write '**/*.json'"
format-toml = "fd -H -e toml -X tombi format --offline"
format-yaml = "prettier --write '**/*.{yaml,yml}' && prettier --write --parser yaml .clang-format"
format = {
    depends-on = [
        "format-cpp",
        "format-python",
        "format-web",
        "format-markdown",
        "format-json",
        "format-toml",
        "format-yaml",
    ]
}
lint-python = "ruff check ."

[environments]
dev = ["dev"]
format = { features = ["format"], no-default-feature = true }

[tasks]
npm-install = {
    cmd = "pnpm install",
    inputs = [
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "package.json",
        "sdk/typescript/package.json",
        "tests/package.json",
        "tools/package.json",
    ]
}

# Into build/{{ type }}/bin/bin (.bazelrc), Bazel being npm's
# bazelisk (package.json), which runs the release of .bazelversion. Arguments
# after `--` go to Bazel: more targets, such as //:package and //:symbols,
# and options, such as --platforms=@xclang//platforms:aarch64-w64-mingw32.
[tasks.build]
args = [{ arg = "type", choices = ["Debug", "RelWithDebInfo"], default = "RelWithDebInfo" }]
cmd = "pnpm exec bazel build --config={{ type }} //:dist"
depends-on = ["npm-install"]

# The protocol's schema, from the messages src/protocol/protocol.h
# defines, and the SDKs' types generated from it (sdk/generate.py).
[tasks.protocol]
cmd = """pnpm exec bazel run //:catter-protocol-schema -- \
$PIXI_PROJECT_ROOT/sdk/protocol.schema.json && python sdk/generate.py"""
depends-on = ["npm-install"]

# Fails when what `protocol` writes differs from what is checked in.
[tasks.check-protocol]
cmd = "git diff --exit-code -- sdk/protocol.schema.json sdk/python/catter/protocol.py sdk/typescript/src/protocol.ts"
depends-on = ["protocol"]

[tasks.ci-check]
depends-on = [
    { task = "check-testing" },
    { task = "check-sdk-ts" },
    { task = "check-layers" },
]

# Each directory of src/ includes only the layers below it
# (scripts/check_layers.py).
[tasks.check-layers]
cmd = "python scripts/check_layers.py"

# The TypeScript SDK (sdk/typescript): types and lint.
[tasks.check-sdk-ts]
cmd = "pnpm --dir sdk/typescript run check"
depends-on = ["npm-install"]

# The test runner (tools/) and the cases' scripts (tests/): types, lint, and
# the runner's own tests.
[tasks.check-testing]
cmd = "pnpm --dir tools run check && pnpm --dir tools run test && pnpm --dir tests run check"
depends-on = ["npm-install"]
