# tombi: format.rules.table-keys-order.disabled = true
[workspace]
name = "catter"
version = "0.0.1"
description = "A new tool to capture C++ compilation command"
authors = [
    "star9029 <hengxing9029@outlook.com>",
    "clice contributors <clice@clice.io>",
]
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://clice.io"
repository = "https://github.com/clice-io/catter"
channels = ["conda-forge", "https://conda.clice.io"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
pnpm = "*"
# From xclang (clice-io/xclang): the option tables of clang, lld, llvm-lib
# and llvm-dlltool, and the toolchain whose clang builds catter on macOS and
# for MinGW.
llvm-option-inc = "==23.1.2.4"
xclang = "==23.1.2.4"

# Bug, see https://github.com/prefix-dev/setup-pixi/issues/258
[target.win-64.dependencies]
vs2022_win-64 = "==19.44.35207"
vc14_runtime = "==14.44.35208"
ucrt = "==10.0.26100.0"

[target.win-64.activation.env]
PATH = "%PIXI_PROJECT_ROOT%/api/node_modules/.bin;%PATH%"
CATTER_DEFAULT_TOOLCHAIN = "msvc"

[target.linux-64.dependencies]
sysroot_linux-64 = "==2.17"
gcc = "==14.2.0"
gxx = "==14.2.0"

[target.linux.activation.env]
PATH = "$PIXI_PROJECT_ROOT/api/node_modules/.bin:$PATH"
CATTER_DEFAULT_TOOLCHAIN = "gcc"

[target.osx.activation.env]
PATH = "$PIXI_PROJECT_ROOT/api/node_modules/.bin:$PATH"
CATTER_DEFAULT_TOOLCHAIN = "clang"

[feature.clang.dependencies]
clang = "==20.1.8"
clangxx = "==20.1.8"
lld = "==20.1.8"
llvm-tools = "==20.1.8"
compiler-rt = "==20.1.8"

[feature.clang.tasks.cfg]
args = [
    { arg = "mode", choices = ["debug", "release"] },
    { arg = "toolchain", choices = ["msvc", "clang", "clang-cl", "gcc"], default = "clang" },
]
cmd = """xmake config --clean --yes --test=y --mode={{ mode }} --toolchain={{ toolchain }}"""

[feature.dev.dependencies]
python = ">=3.14.2,<3.15"
nodejs = "==24.4.0"
# The build systems the cases build with (tests/builds), pinned so that
# their output reads the same on every machine.
cmake = "==4.1.2"
ninja = "==1.13.1"

[feature.dev.tasks]
unit-test = "xmake test --verbose"
check-doc-translations = "node tools/docs/translations.ts check"
report-doc-translations = "node tools/docs/translations.ts report"
record-doc-translations = "node tools/docs/translations.ts record"
review-doc-translations = "node tools/docs/translations.ts review --glossary=.claude/skills/translate-docs/SKILL.md"
ut = [{ task = "unit-test" }]

# The cases under tests/ (tests/README.md), against the catter of a build
# mode, or shard i of n of them.
[feature.dev.tasks.cases-test]
args = [
    { arg = "mode", choices = ["debug", "release", "releasedbg"], default = "release" },
    { arg = "shard", default = "1/1" },
]
cmd = "CATTER_BUILD_MODE={{ mode }} CATTER_CASES_SHARD={{ shard }} pnpm --dir tests run cases"
depends-on = ["npm-install"]

# Configure and build a mode, then run the unit tests and the cases on it.
[feature.dev.tasks.test]
args = [
    { arg = "mode", choices = ["debug", "release", "releasedbg"], default = "debug" },
]
depends-on = [
    { task = "ci-build", args = ["{{ mode }}"] },
    { task = "cases-test", args = ["{{ mode }}"] },
]

# Windows with xclang: the MinGW target (x86_64-w64-mingw32) instead of MSVC.
[feature.mingw]
platforms = ["win-64"]

[feature.mingw.tasks.cfg]
args = [
    { arg = "mode", choices = ["debug", "release", "releasedbg"] },
]
cmd = """xmake config --clean --yes --test=y --mode={{ mode }} --plat=mingw --arch=x86_64 \
--toolchain=llvm --sdk=$CONDA_PREFIX/opt/xclang"""

# ============================================================================== #
#                                    FORMAT                                      #
# ============================================================================== #
[feature.format.dependencies]
ruff = "*"
tombi = "==1.8.5"
fd-find = "*"
prettier = "*"
clang-format = "==23.1.1"

[feature.format.tasks]
format-cpp = "fd -H -e cpp -e h -e cc -e hpp -X clang-format -i"
format-python = "ruff format ."
# prettier expands its own globs: on Windows it is a .bat, which fd -X
# cannot start.
format-web = "prettier --write '**/*.{js,mjs,ts,css}'"
format-markdown = "prettier --write '**/*.md'"
format-json = "prettier --write '**/*.{json,jsonc}'"
format-toml = "fd -H -e toml -X tombi format --offline"
format-yaml = "prettier --write '**/*.{yaml,yml}' && prettier --write --parser yaml .clang-format"
format = {
    depends-on = [
        "format-cpp",
        "format-python",
        "format-web",
        "format-markdown",
        "format-json",
        "format-toml",
        "format-yaml",
    ]
}
lint-python = "ruff check ."

[environments]
dev = ["dev"]
format = { features = ["format"], no-default-feature = true }
clang = { features = ["dev", "clang"] }
mingw = ["dev", "mingw"]

[tasks]
npm-install = {
    cmd = "pnpm install",
    inputs = [
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "package.json",
        "api/dev/package.json",
        "scripts/package.json",
        "sdk/typescript/package.json",
    ]
}
build = "xmake --verbose --diagnosis"

[tasks.cfg]
args = [
    { arg = "mode", choices = ["debug", "release", "releasedbg"] },
    { arg = "toolchain", choices = ["msvc", "clang", "clang-cl", "gcc", "default"], default = "default" },
]
cmd = """xmake config --clean --yes --test=y --mode={{ mode }} --toolchain=\
{% if toolchain == "default" %}$CATTER_DEFAULT_TOOLCHAIN{% else %}{{ toolchain }}{% endif %}"""

# What a CI build job runs: the build and the unit tests. The cases run in
# jobs of their own, on the programs it uploads
# (.github/workflows/test-target.yml).
[tasks.ci-build]
args = [
    { "arg" = "mode", "choices" = ["debug", "release", "releasedbg"] },
]
depends-on = [
    { task = "npm-install" },
    { task = "cfg", args = ["{{ mode }}"] },
    { task = "build" },
    { task = "ut" },
    { task = "check-protocol" },
]

# The protocol's schema, from the messages src/catter/core/protocol.h
# defines, and the SDKs' types generated from it (sdk/generate.py), on a
# built tree.
[tasks.protocol]
cmd = "xmake run catter-protocol-schema $PIXI_PROJECT_ROOT/sdk/protocol.schema.json && python sdk/generate.py"

# Fails when what `protocol` writes differs from what is checked in.
[tasks.check-protocol]
cmd = "git diff --exit-code -- sdk"
depends-on = ["protocol"]

[tasks.lint-ts]
cmd = "pnpm exec eslint --cache ."
depends-on = ["npm-install"]

[tasks.ci-check]
depends-on = [
    { task = "lint-ts" },
    { task = "check-js-modules" },
    { task = "check-testing" },
    { task = "check-sdk-ts" },
]

[tasks.check-sdk-ts]
cmd = "pnpm --dir sdk/typescript run typecheck"
depends-on = ["npm-install"]

# The test runner (tools/) and the cases' scripts (tests/): types, lint, and
# the runner's own tests.
[tasks.check-testing]
cmd = "pnpm --dir tools run check && pnpm --dir tools run test && pnpm --dir tests run check"
depends-on = ["npm-install"]

[tasks.build-js]
cmd = "pnpm --dir api/dev run build"

[tasks.build-js-runtime]
cmd = "pnpm --dir api/dev run build:runtime"

[tasks.build-js-scripts]
cmd = "pnpm --dir scripts run build"

[tasks.build-js-types]
cmd = "pnpm --dir api/dev run build:types"

[tasks.build-js-tests]
cmd = "pnpm --dir api/dev run build:tests"
depends-on = "build-js-types"

[tasks.check-js-modules]
cmd = "pnpm --dir api/dev run check:modules"

[tasks.clean-js]
cmd = "pnpm --dir api/dev run clean"

[tasks.package]
args = [{ arg = "outputdir", default = "release-assets" }]
cmd = "xmake pack --yes --verbose --outputdir={{ outputdir }}"
