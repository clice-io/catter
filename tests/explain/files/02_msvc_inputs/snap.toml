[test."$ catter explain -- cl /nologo /c /Tc a.txt /Tp b.txt"]
stdout = '''
{
    "analyzer": "compiler",
    "compiler": "builtin:msvc",
    "dialect": "msvc",
    "phase": "compile",
    "artifact": "object",
    "target": {
        "triple": "unknown-pc-windows-msvc",
        "os": "windows",
        "objectFormat": "coff",
        "env": "msvc",
        "artifactModel": "coff-msvc",
        "from": "driver-default"
    },
    "sources": [
        "a.txt",
        "b.txt"
    ],
    "reads": [
        "a.txt",
        "b.txt"
    ],
    "writes": [
        "a.obj",
        "b.obj"
    ],
    "edges": [
        {
            "output": "a.obj",
            "inputs": [
                "a.txt"
            ]
        },
        {
            "output": "b.obj",
            "inputs": [
                "b.txt"
            ]
        }
    ],
    "inferred": [
        {
            "path": "a.obj",
            "reason": "default-output"
        },
        {
            "path": "b.obj",
            "reason": "default-output"
        }
    ],
    "entries": [
        {
            "directory": "${WS}",
            "file": "a.txt",
            "arguments": [
                "cl",
                "/nologo",
                "/c",
                "/Tc",
                "a.txt",
                "/Tp",
                "b.txt"
            ],
            "output": "${WS}/a.obj"
        },
        {
            "directory": "${WS}",
            "file": "b.txt",
            "arguments": [
                "cl",
                "/nologo",
                "/c",
                "/Tc",
                "a.txt",
                "/Tp",
                "b.txt"
            ],
            "output": "${WS}/b.obj"
        }
    ]
}
'''
exit = 0

