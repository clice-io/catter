[hook."$ catter run --handler \"python handler.py\" -- node build.mjs"]
stdout = '''
act-on-me: exit 1
leave-me: exit 1
Handler `python handler.py` aborted the build at command 2: act-on-me must not run
'''
stderr = '''
command 1: ['build.mjs']
command 2: ['child.mjs', 'act-on-me']
'''
exit = 1

[replay."$ catter run --handler \"python handler.py\" --from events.json"]
stdout = "Handler `python handler.py` aborted the build at command 2: act-on-me must not run"
stderr = '''
command 1: []
command 2: ['act-on-me']
'''
exit = 1
