[test."$ catter -m replay cdb --abort-on-command-failure -o compile_commands.json -- events.json"]
stdout = "CDB saved to ${WS}/compile_commands.json with 1 entries."
exit = 0

[test."compile_commands.json"]
entries = [
    {
        file = "src/main.c",
        directory = "${WS}",
        output = "${WS}/obj/main.o",
        arguments = ["gcc", "-c", "src/main.c", "-o", "obj/main.o"],
    },
]
