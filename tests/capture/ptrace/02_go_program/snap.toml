[hook."$ catter compile-commands -o compile_commands.json -- ./run"]
stdout = "CDB saved to ${WS}/compile_commands.json with 1 entries."
exit = 0

[hook."compile_commands.json"]
entries = [
    { file = "a.c", directory = "${WS}", output = "${WS}/a.o", arguments = ["cc", "-c", "a.c"] },
]

[ptrace."$ catter compile-commands --capture ptrace -o compile_commands.json -- ./run"]
stdout = "CDB saved to ${WS}/compile_commands.json with 1 entries."
exit = 0

[ptrace."compile_commands.json"]
entries = [
    { file = "a.c", directory = "${WS}", output = "${WS}/a.o", arguments = ["cc", "-c", "a.c"] },
]
