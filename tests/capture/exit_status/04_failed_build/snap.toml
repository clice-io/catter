[hook."$ node build.mjs"]
exit = 3

[hook."$ catter tree -w 1000 -- node build.mjs"]
stdout = '''
Build failed with exit code 3. Printing partial command tree.
node build.mjs
'''
exit = 3

[ptrace."$ catter tree --capture ptrace -w 1000 -- node build.mjs"]
stdout = '''
Build failed with exit code 3. Printing partial command tree.
node build.mjs
'''
exit = 3
