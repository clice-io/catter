[hook."$ node build.mjs"]
killed = "SIGTERM"

[hook."$ node build.mjs".win32]
differs = "Windows has no signals: a program that kills itself exits with 1"
exit = 1

[hook."$ catter tree -w 1000 -- node build.mjs"]
stdout = '''
Build failed with exit code 143. Printing partial command tree.
node build.mjs
'''
killed = "SIGTERM"

[hook."$ catter tree -w 1000 -- node build.mjs".win32]
differs = "Windows has no signals: a program that kills itself exits with 1"
stdout = '''
Build failed with exit code 1. Printing partial command tree.
node build.mjs
'''
exit = 1

[ptrace."$ catter tree --capture ptrace -w 1000 -- node build.mjs"]
stdout = '''
Build failed with exit code 143. Printing partial command tree.
node build.mjs
'''
killed = "SIGTERM"
