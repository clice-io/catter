[test."$ node build.mjs"]
stdout = "status null, signal SIGABRT"
exit = 0

[test."$ node build.mjs".win32]
differs = "Windows has no signals: an aborted program exits with a code"
stdout = "status 134, signal null"
exit = 0

[test."$ catter tree -w 1000 -- node build.mjs"]
stdout = '''
status null, signal SIGABRT
node build.mjs
└── node -e process.abort()
'''
exit = 0

[test."$ catter tree -w 1000 -- node build.mjs".win32]
differs = "Windows has no signals: an aborted program exits with a code"
stdout = '''
status 134, signal null
node build.mjs
└── node -e process.abort()
'''
exit = 0
