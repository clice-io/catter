[hook."$ node build.mjs"]
stdout = '''
the daemon said: running
the daemon stopped: 0
'''
exit = 0

[hook."$ catter tree -w 1000 -- node build.mjs"]
stdout = '''
the daemon said: running
the daemon stopped: 0
node build.mjs
└── python daemon.py
'''
exit = 0

[ptrace."$ catter tree --capture ptrace -w 1000 -- node build.mjs"]
stdout = '''
the daemon said: running
the daemon stopped: 0
node build.mjs
└── python daemon.py
'''
exit = 0
