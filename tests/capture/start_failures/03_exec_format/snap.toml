[test."$ node build.mjs"]
stdout = '''
execv ./no-format: failed to start: Exec format error
posix_spawn ./no-format: failed to start: Exec format error
posix_spawnp no-format: failed to start: Exec format error
execvp no-format: run by /bin/sh
posix_spawnp empty: failed to start: Exec format error
execvp empty: exit 0
execv ./lost-interpreter: failed to start: No such file or directory
posix_spawn ./lost-interpreter: failed to start: No such file or directory
'''
exit = 0

[test."$ node build.mjs".darwin]
differs = "macOS's posix_spawnp gives a file of no executable format to /bin/sh, as execvp does"
stdout = '''
execv ./no-format: failed to start: Exec format error
posix_spawn ./no-format: failed to start: Exec format error
posix_spawnp no-format: run by /bin/sh
exit 0
execvp no-format: run by /bin/sh
posix_spawnp empty: exit 0
execvp empty: exit 0
execv ./lost-interpreter: failed to start: No such file or directory
posix_spawn ./lost-interpreter: failed to start: No such file or directory
'''
exit = 0

