[hook."$ node build.mjs"]
stdout = "the program is gone"
exit = 0

[hook."$ catter tree -w 1000 -- node build.mjs"]
stdout = '''
the program is gone
node build.mjs
└── node child.mjs
'''
exit = 0

[ptrace."$ catter tree --capture ptrace -w 1000 -- node build.mjs"]
stdout = '''
the program is gone
node build.mjs
└── node child.mjs
'''
exit = 0
