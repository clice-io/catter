[hook."$ node build.mjs"]
stdout = "the script ran, exit 0"
exit = 0

[hook."$ catter tree -w 1000 -- node build.mjs"]
stdout = '''
the script ran, exit 0
node build.mjs
└── ./script.sh
'''
exit = 0

[ptrace."$ catter tree --capture ptrace -w 1000 -- node build.mjs"]
stdout = '''
the script ran, exit 0
node build.mjs
└── /bin/sh ./script.sh
'''
exit = 0
