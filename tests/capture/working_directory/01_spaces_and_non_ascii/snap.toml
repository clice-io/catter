[hook."$ node build.mjs"]
stdout = "with space 中文"
exit = 0

[hook."$ catter tree -w 1000 -- node build.mjs"]
stdout = '''
with space 中文
node build.mjs
└── node ${WS}/child.mjs
'''
exit = 0

[hook."$ catter tree -w 1000 -- node build.mjs".win32]
differs = "tree quotes a Windows path, which holds a space"
stdout = '''
with space 中文
node build.mjs
└── node "${WS}/child.mjs"
'''
exit = 0

[ptrace."$ catter tree --capture ptrace -w 1000 -- node build.mjs"]
stdout = '''
with space 中文
node build.mjs
└── node ${WS}/child.mjs
'''
exit = 0
