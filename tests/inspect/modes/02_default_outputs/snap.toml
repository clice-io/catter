[test."$ catter script::inspect -- gcc -c a.c"]
stdout = '''
{
    "analyzer": "compiler",
    "compiler": "builtin:gcc",
    "dialect": "gcc",
    "phase": "compile",
    "artifact": "object",
    "target": {
        "os": "linux",
        "objectFormat": "elf",
        "artifactModel": "elf",
        "from": "host-fallback"
    },
    "sources": [
        "a.c"
    ],
    "reads": [
        "a.c"
    ],
    "writes": [
        "a.o"
    ],
    "edges": [
        {
            "output": "a.o",
            "inputs": [
                "a.c"
            ]
        }
    ],
    "inferred": [
        {
            "path": "a.o",
            "reason": "default-output"
        }
    ],
    "entries": [
        {
            "directory": "${WS}",
            "file": "a.c",
            "arguments": [
                "gcc",
                "-c",
                "a.c"
            ],
            "output": "${WS}/a.o"
        }
    ]
}
'''
exit = 0

