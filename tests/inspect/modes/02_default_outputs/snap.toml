[test."$ catter script::inspect -- gcc a.c"]
wrong = "the default a.out is not inferred, so the command gets no entry (catter#132)"
stdout = '''
{
    "analyzer": "compiler",
    "compiler": "builtin:gcc",
    "dialect": "gcc",
    "phase": "link",
    "artifact": "exe",
    "target": {
        "os": "linux",
        "objectFormat": "elf",
        "artifactModel": "elf",
        "from": "host-fallback"
    },
    "sources": [
        "a.c"
    ],
    "reads": [
        "a.c"
    ],
    "writes": [],
    "edges": [],
    "diagnostics": [
        {
            "code": "implicit-output-unresolved",
            "message": "cannot infer implicit output for gcc link/exe"
        }
    ],
    "entries": []
}
'''
exit = 0

