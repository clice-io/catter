[test."$ catter script::inspect --"]
stdout = "inspect: give the command to analyze after --"
exit = 1

[test."$ catter script::inspect --help -- gcc -c a.c"]
stdout = '''
Print how catter analyzes the command after --, without running it.

Usage:
  inspect [options]

Options:
  -h, --help  Print this help message.

Examples:
  inspect -- clang++ -c src/main.cc -o main.o
  # The compiler, its mode, target, sources and outputs.
'''
exit = 0

[test."$ catter script::inspect --bogus -- gcc -c a.c"]
stdout = '''
inspect: unknown option '--bogus'

Print how catter analyzes the command after --, without running it.

Usage:
  inspect [options]

Options:
  -h, --help  Print this help message.

Examples:
  inspect -- clang++ -c src/main.cc -o main.o
  # The compiler, its mode, target, sources and outputs.
'''
exit = 1
