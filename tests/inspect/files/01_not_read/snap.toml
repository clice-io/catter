[test."$ catter script::inspect -- cl /nologo /c a.cc /link /out:a.exe"]
stdout = '''
{
  "analyzer": "compiler",
  "compiler": "builtin:msvc",
  "dialect": "msvc",
  "phase": "compile",
  "artifact": "object",
  "target": {
    "triple": "unknown-pc-windows-msvc",
    "os": "windows",
    "objectFormat": "coff",
    "env": "msvc",
    "artifactModel": "coff-msvc",
    "from": "driver-default"
  },
  "sources": [
    "a.cc"
  ],
  "reads": [
    "a.cc"
  ],
  "writes": [
    "a.obj"
  ],
  "edges": [
    {
      "output": "a.obj",
      "inputs": [
        "a.cc"
      ]
    }
  ],
  "inferred": [
    {
      "path": "a.obj",
      "reason": "default-output"
    }
  ],
  "diagnostics": [
    {
      "code": "output-kind-ignored",
      "message": "output kind linked-artifact is not used for compile",
      "path": "a.exe",
      "index": 5,
      "source": {
        "kind": "remainder-option",
        "boundary": "/link",
        "boundaryIndex": 4,
        "option": "/out:",
        "optionIndex": 5
      }
    }
  ],
  "entries": [
    {
      "directory": "${WS}",
      "file": "a.cc",
      "arguments": [
        "cl",
        "/nologo",
        "/c",
        "a.cc",
        "/link",
        "/out:a.exe"
      ],
      "output": "${WS}/a.obj"
    }
  ]
}
'''
exit = 0
