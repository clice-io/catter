[test."$ catter script::inspect -- gcc -c a.c @args.rsp -o a.o"]
wrong = "gcc reads the response file args.rsp, which is not expanded (catter#123)"
stdout = '''
{
  "analyzer": "compiler",
  "compiler": "builtin:gcc",
  "dialect": "gcc",
  "phase": "compile",
  "artifact": "object",
  "target": {
    "os": "linux",
    "objectFormat": "elf",
    "artifactModel": "elf",
    "from": "host-fallback"
  },
  "sources": [
    "a.c"
  ],
  "reads": [
    "a.c"
  ],
  "writes": [
    "a.o"
  ],
  "edges": [
    {
      "output": "a.o",
      "inputs": [
        "a.c"
      ]
    }
  ],
  "diagnostics": [
    {
      "code": "input-candidate-rejected",
      "message": "input candidate did not match suffix rules",
      "path": "@args.rsp",
      "index": 3,
      "source": {
        "kind": "argument"
      }
    }
  ],
  "entries": [
    {
      "directory": "${WS}",
      "file": "a.c",
      "arguments": [
        "gcc",
        "-c",
        "a.c",
        "@args.rsp",
        "-o",
        "a.o"
      ],
      "output": "${WS}/a.o"
    }
  ]
}
'''
exit = 0

