[test."$ catter script::inspect -- cl /nologo /c /Fo:out/ a.cc b.cc"]
stdout = '''
{
  "analyzer": "compiler",
  "compiler": "builtin:msvc",
  "dialect": "msvc",
  "phase": "compile",
  "artifact": "object",
  "target": {
    "triple": "unknown-pc-windows-msvc",
    "os": "windows",
    "objectFormat": "coff",
    "env": "msvc",
    "artifactModel": "coff-msvc",
    "from": "driver-default"
  },
  "sources": [
    "a.cc",
    "b.cc"
  ],
  "reads": [
    "a.cc",
    "b.cc"
  ],
  "writes": [
    "out/a.obj",
    "out/b.obj"
  ],
  "edges": [
    {
      "output": "out/a.obj",
      "inputs": [
        "a.cc"
      ]
    },
    {
      "output": "out/b.obj",
      "inputs": [
        "b.cc"
      ]
    }
  ],
  "entries": [
    {
      "directory": "${WS}",
      "file": "a.cc",
      "arguments": [
        "cl",
        "/nologo",
        "/c",
        "/Fo:out/",
        "a.cc",
        "b.cc"
      ],
      "output": "${WS}/out/a.obj"
    },
    {
      "directory": "${WS}",
      "file": "b.cc",
      "arguments": [
        "cl",
        "/nologo",
        "/c",
        "/Fo:out/",
        "a.cc",
        "b.cc"
      ],
      "output": "${WS}/out/b.obj"
    }
  ]
}
'''
exit = 0

