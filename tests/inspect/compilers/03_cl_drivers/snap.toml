  "artifact": "object",
  "target": {
    "triple": "unknown-pc-windows-msvc",
    "os": "windows",
    "objectFormat": "coff",
    "env": "msvc",
    "artifactModel": "coff-msvc",
    "from": "driver-default"
  },
  "sources": [
    "a.cc"
  ],
  "reads": [
    "a.cc"
  ],
  "writes": [
    "a.obj"
  ],
  "edges": [
    {
      "output": "a.obj",
      "inputs": [
        "a.cc"
      ]
    }
  ],
  "inferred": [
    {
      "path": "a.obj",
      "reason": "default-output"
    }
  ],
  "entries": [
    {
      "directory": "${WS}",
      "file": "a.cc",
      "arguments": [
        "clang-cl",
        "/c",
        "a.cc"
      ],
      "output": "${WS}/a.obj"
    }
  ]
}
'''
exit = 0

