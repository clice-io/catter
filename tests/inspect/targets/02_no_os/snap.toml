[test."$ catter script::inspect -- clang --target=wasm32 -c a.c"]
stdout = '''
{
    "analyzer": "compiler",
    "compiler": "builtin:clang",
    "dialect": "clang",
    "phase": "compile",
    "artifact": "object",
    "target": {
        "triple": "wasm32",
        "artifactModel": "elf",
        "from": "argument"
    },
    "sources": [
        "a.c"
    ],
    "reads": [
        "a.c"
    ],
    "writes": [
        "a.o"
    ],
    "edges": [
        {
            "output": "a.o",
            "inputs": [
                "a.c"
            ]
        }
    ],
    "inferred": [
        {
            "path": "a.o",
            "reason": "default-output"
        }
    ],
    "entries": [
        {
            "directory": "${WS}",
            "file": "a.c",
            "arguments": [
                "clang",
                "--target=wasm32",
                "-c",
                "a.c"
            ],
            "output": "${WS}/a.o"
        }
    ]
}
'''
exit = 0

