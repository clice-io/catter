[test."compile_commands.json"]
wrong = "the arguments in the response files are not expanded (catter#123)"
entries = [
    {
        file = "${WS}/src/main.cc",
        directory = "${WS}/build",
        output = "${WS}/build/CMakeFiles/hello.dir/src/main.cc.o",
        arguments = [
            "${ENV}/bin/c++",
            "@CMakeFiles/hello.dir/src/main.cc.o.rsp",
            "-MD",
            "-MT",
            "CMakeFiles/hello.dir/src/main.cc.o",
            "-MF",
            "CMakeFiles/hello.dir/src/main.cc.o.d",
            "-o",
            "CMakeFiles/hello.dir/src/main.cc.o",
            "-c",
            "${WS}/src/main.cc",
        ],
    },
    {
        file = "${WS}/src/util.cc",
        directory = "${WS}/build",
        output = "${WS}/build/CMakeFiles/hello.dir/src/util.cc.o",
        arguments = [
            "${ENV}/bin/c++",
            "@CMakeFiles/hello.dir/src/util.cc.o.rsp",
            "-MD",
            "-MT",
            "CMakeFiles/hello.dir/src/util.cc.o",
            "-MF",
            "CMakeFiles/hello.dir/src/util.cc.o.d",
            "-o",
            "CMakeFiles/hello.dir/src/util.cc.o",
            "-c",
            "${WS}/src/util.cc",
        ],
    },
]

