[hook."$ catter compile-commands -o compile_commands.json -- bazel --output_base=out build //:main"]
stdout = "CDB saved to ${WS}/compile_commands.json with 1 entries."
stderr = "OpenJDK 64-Bit Server VM warning: Options -Xverify:none and -noverify were deprecated in JDK 13 and will likely be removed in a future release."
exit = 0

[hook."$ catter compile-commands -o compile_commands.json -- bazel --output_base=out build //:main".darwin]
wrong = "macOS runs Bazel's actions through Apple's sandbox-exec, which runs without the hook: the compile it starts goes uncaptured"
stdout = "CDB saved to ${WS}/compile_commands.json with 0 entries."
stderr = "OpenJDK 64-Bit Server VM warning: Options -Xverify:none and -noverify were deprecated in JDK 13 and will likely be removed in a future release."
exit = 0

[hook."compile_commands.json"]
entries = [
    {
        file = "src/main.c",
        directory = "${WS}/out/execroot/_main",
        output = "${WS}/out/execroot/_main/bazel-out/k8-fastbuild/bin/main.o",
        arguments = ["cc", "-Iinclude", "-c", "src/main.c", "-o", "bazel-out/k8-fastbuild/bin/main.o"],
    },
]

[hook."compile_commands.json".darwin]
wrong = "macOS runs Bazel's actions through Apple's sandbox-exec, which runs without the hook: the compile it starts goes uncaptured"
entries = []
