[test."$ catter compile-commands -o compile_commands.json -- make -j4"]
stdout = '''
make -C sub
make[1]: Entering directory '${WS}/sub'
g++ -DCATTER_TEST=1 -c a.cc -o a.o
g++ -DCATTER_TEST=1 -c b.cc -o b.o
make[1]: Leaving directory '${WS}/sub'
CDB saved to ${WS}/compile_commands.json with 2 entries.
'''
exit = 0

[test."$ catter compile-commands -o compile_commands.json -- make -j4".darwin]
wrong = "Apple's make runs without the hook, and what it starts goes uncaptured"
stdout = '''
${XCODE}/usr/bin/make -C sub
c++ -DCATTER_TEST=1 -c a.cc -o a.o
c++ -DCATTER_TEST=1 -c b.cc -o b.o
CDB saved to ${WS}/compile_commands.json with 0 entries.
'''
exit = 0

[test."compile_commands.json"]
entries = [
    {
        file = "a.cc",
        directory = "${WS}/sub",
        output = "${WS}/sub/a.o",
        arguments = ["g++", "-DCATTER_TEST=1", "-c", "a.cc", "-o", "a.o"],
    },
    {
        file = "b.cc",
        directory = "${WS}/sub",
        output = "${WS}/sub/b.o",
        arguments = ["g++", "-DCATTER_TEST=1", "-c", "b.cc", "-o", "b.o"],
    },
]

[test."compile_commands.json".darwin]
wrong = "Apple's make runs without the hook, and what it starts goes uncaptured"
entries = []
