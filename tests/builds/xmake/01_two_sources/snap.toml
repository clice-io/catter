[test."compile_commands.json".win32]
wrong = "the sources xmake compiles to probe the compiler get entries (catter#117); xmake compiles with MSVC's cl.exe, which takes other flags, and probes it with other files"
entries = [
    {
        file = "${TMP}/.xmake#/#/_#.cpp",
        directory = "${TMP}/.xmake#/#",
        output = "${TMP}/.xmake#/#/_#",
        arguments = [
            "${MSVC}/bin/hostx64/x64/cl.exe",
            "-c",
            "-nologo",
            "/sourceDependencies",
            "${TMP}/.xmake#/#/_#.json",
            "-nologo",
            "-Fo${TMP}/.xmake#/#/_#",
            "${TMP}/.xmake#/#/_#.cpp",
        ],
    },
    {
        file = 'src\main.cc',
        directory = "${WS}",
        output = "${WS}/build/.objs/hello/windows/x64/release/src/main.cc.obj",
        arguments = [
            "${MSVC}/bin/HostX64/x64/cl.exe",
            "-c",
            "-nologo",
            "-MD",
            "-Iinclude",
            "-DCATTER_TEST=1",
            "/EHsc",
            "/sourceDependencies",
            "${TMP}/.xmake#/#/_#.json",
            '-Fobuild\.objs\hello\windows\x64\release\src\main.cc.obj',
            'src\main.cc',
        ],
    },
    {
        file = 'src\util.cc',
        directory = "${WS}",
        output = "${WS}/build/.objs/hello/windows/x64/release/src/util.cc.obj",
        arguments = [
            "${MSVC}/bin/HostX64/x64/cl.exe",
            "-c",
            "-nologo",
            "-MD",
            "-Iinclude",
            "-DCATTER_TEST=1",
            "/EHsc",
            "/sourceDependencies",
            "${TMP}/.xmake#/#/_#.json",
            '-Fobuild\.objs\hello\windows\x64\release\src\util.cc.obj',
            'src\util.cc',
        ],
    },
]
