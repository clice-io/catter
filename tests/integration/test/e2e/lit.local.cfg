# ruff: noqa: F821
# End-to-end tests: run catter over real build systems and check the
# compilation database it writes. Each test builds a copy of a project from
# Inputs/ in its own temporary directory.
import os
import platform
import shutil
import subprocess
import sys

# Inputs/ holds the projects (whose .cc files are not tests) and e2e.py.
config.excludes = ["Inputs"]

# Real builds see the full environment, as they do for a user: compilers,
# SDKs and build tools are found through variables lit does not pass on by
# default.
config.environment = {**os.environ, **config.environment}

# Debug builds with gcc run catter with libasan preloaded (see lit.cfg.py),
# and the preload reaches every build tool the proxy launches. The tools are
# not instrumented, so LeakSanitizer reports their deliberate leaks at exit
# and fails the build. Leak checking of catter itself stays with the other
# suites.
asan_options = config.environment.get("ASAN_OPTIONS")
config.environment["ASAN_OPTIONS"] = ":".join(
    filter(None, [asan_options, "detect_leaks=0"])
)

windows = platform.system() == "Windows"


def msvc_environment(base: dict[str, str]) -> dict[str, str]:
    """The environment of a Visual Studio developer prompt for x64.

    Builds that call cl.exe directly (CMake with Ninja) also need the SDK
    tools (rc.exe, mt.exe) and paths that only vcvars sets up together.
    """
    program_files = base.get("PROGRAMFILES(X86)", r"C:\Program Files (x86)")
    vswhere = os.path.join(
        program_files, "Microsoft Visual Studio", "Installer", "vswhere.exe"
    )
    if not os.path.isfile(vswhere):
        lit_config.warning(f"vswhere not found at {vswhere}")
        return {}
    installation = subprocess.run(
        [vswhere, "-latest", "-products", "*", "-requires",
         "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
         "-property", "installationPath"],
        capture_output=True, text=True,
    ).stdout.strip()
    vcvars = os.path.join(installation, "VC", "Auxiliary", "Build", "vcvars64.bat")
    if not installation or not os.path.isfile(vcvars):
        lit_config.warning(f"vcvars64.bat not found under {installation!r}")
        return {}
    # vcvars refuses to run in a prompt that is already set up, as pixi's
    # activation of the MSVC toolchain leaves this one; run it in a minimal
    # environment and keep what it adds.
    kept = [
        "SYSTEMROOT", "SYSTEMDRIVE", "WINDIR", "COMSPEC", "PATHEXT", "TEMP", "TMP",
        "USERPROFILE", "USERNAME", "APPDATA", "LOCALAPPDATA", "PROGRAMDATA",
        "PROGRAMFILES", "PROGRAMFILES(X86)", "PROGRAMW6432", "COMMONPROGRAMFILES",
        "COMMONPROGRAMFILES(X86)", "PROCESSOR_ARCHITECTURE", "NUMBER_OF_PROCESSORS",
    ]
    clean = {name: base[name] for name in kept if name in base}
    root = base.get("SYSTEMROOT", r"C:\Windows")
    system_path = [
        os.path.join(root, "System32"),
        root,
        os.path.join(root, "System32", "Wbem"),
        os.path.join(root, "System32", "WindowsPowerShell", "v1.0"),
    ]
    clean["PATH"] = os.pathsep.join(system_path)
    marker = "::catter-e2e-environment::"
    result = subprocess.run(
        f'cmd /s /c ""{vcvars}" && echo {marker} && set"',
        capture_output=True, text=True, env=clean,
    )
    messages, found, variables = result.stdout.partition(marker)
    if not found:
        lit_config.warning(
            f"{vcvars} failed with {result.returncode}:\n{messages}\n{result.stderr}"
        )
        return {}
    # Upper-case the names as os.environ does on Windows, so `Path` from `set`
    # replaces PATH instead of sitting next to it.
    environment = {
        name.upper(): value
        for name, value in (
            line.split("=", 1) for line in variables.splitlines() if "=" in line
        )
    }
    added = [
        entry for entry in environment.get("PATH", "").split(os.pathsep)
        if entry and entry not in system_path
    ]
    environment["PATH"] = os.pathsep.join(added + [base.get("PATH", "")])
    return environment


if windows:
    config.environment.update(msvc_environment(config.environment))
    for tool in ("cl", "rc", "mt"):
        if not shutil.which(tool, path=config.environment.get("PATH")):
            lit_config.warning(f"{tool}.exe is not on the developer environment's PATH")

helper = os.path.join(config.test_source_root, "e2e", "Inputs", "e2e.py")
e2e = f'"{sys.executable}" "{helper}"'.replace("\\", "/")
config.substitutions.append(("%e2e", e2e))

# Every catter run here is bounded: a hang (several are known) must fail its
# test and clean up after itself, not stall the whole suite.
config.substitutions = [
    (key, f"{e2e} timeout 300 -- {value}" if key == "%catter" else value)
    for key, value in config.substitutions
]

# The C++ compiler of the developer environment, for tests that call it
# directly: cl on Windows, the pixi environment's g++ or clang++ elsewhere.
path = config.environment.get("PATH")
cxx = shutil.which("cl", path=path) if windows else (
    shutil.which("g++", path=path) or shutil.which("clang++", path=path)
)
if cxx:
    config.substitutions.append(("%cxx", f'"{cxx}"'.replace("\\", "/")))

tools = {
    # Makefiles invoke POSIX shells and tools.
    "make": not windows and shutil.which("make"),
    "cmake-ninja": shutil.which("cmake") and shutil.which("ninja"),
    "xmake": shutil.which("xmake"),
    "msbuild": windows and shutil.which("cmake"),
}
for feature, found in tools.items():
    if found:
        config.available_features.add(feature)

# Locally a missing tool only skips its test; CI must run them all.
expected = {"cmake-ninja", "xmake", "msbuild"} if windows else {"make", "cmake-ninja", "xmake"}
missing = sorted(feature for feature in expected if not tools[feature])
if missing and os.environ.get("CI"):
    lit_config.fatal(f"end-to-end build tools not found: {', '.join(missing)}")
