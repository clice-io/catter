[test."$ catter tree --from version.json"]
stdout = "Unsupported replay file version: 2"
exit = 1

[test."$ catter tree --from missing_field.json"]
stdout = "Replay file is not valid: ${WS}/missing_field.json: missing required field 'exe'"
exit = 1

[test."$ catter tree --from not_json.json"]
stdout = "Replay file is not valid: ${WS}/not_json.json: TAPE_ERROR: The JSON document has an improper structure: missing or superfluous commas, braces, missing keys, etc.  This is a fatal and unrecoverable error."
exit = 1
