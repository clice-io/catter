[posix."$ catter compile-commands -o compile_commands.json -- c++ -fsyntax-only -DCATTER_TEST=1 -Iinclude src/main.cc"]
stdout = "CDB saved to ${WS}/compile_commands.json with 1 entries."
exit = 0

[posix."compile_commands.json"]
entries = [
    {
        file = "src/main.cc",
        directory = "${WS}",
        arguments = ["c++", "-fsyntax-only", "-DCATTER_TEST=1", "-Iinclude", "src/main.cc"],
    },
]

[msvc."$ catter compile-commands -o compile_commands.json -- cl /nologo /Zs /DCATTER_TEST=1 /Iinclude src/main.cc"]
stdout = '''
main.cc
CDB saved to ${WS}/compile_commands.json with 0 entries.
'''
exit = 0

[msvc."compile_commands.json"]
entries = []
