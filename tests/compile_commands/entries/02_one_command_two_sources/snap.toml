[posix."$ catter compile-commands -o compile_commands.json -- c++ -DCATTER_TEST=1 -Iinclude src/main.cc src/util.cc -o hello"]
stdout = "CDB saved to ${WS}/compile_commands.json with 2 entries."
exit = 0

[posix."compile_commands.json"]
entries = [
    {
        file = "src/main.cc",
        directory = "${WS}",
        output = "${WS}/hello",
        arguments = ["c++", "-DCATTER_TEST=1", "-Iinclude", "src/main.cc", "src/util.cc", "-o", "hello"],
    },
    {
        file = "src/util.cc",
        directory = "${WS}",
        output = "${WS}/hello",
        arguments = ["c++", "-DCATTER_TEST=1", "-Iinclude", "src/main.cc", "src/util.cc", "-o", "hello"],
    },
]

[msvc."$ catter compile-commands -o compile_commands.json -- cl /nologo /EHsc /DCATTER_TEST=1 /Iinclude src/main.cc src/util.cc /Fehello.exe"]
stdout = '''
main.cc
util.cc
Generating Code...
CDB saved to ${WS}/compile_commands.json with 2 entries.
'''
exit = 0

[msvc."compile_commands.json"]
entries = [
    {
        file = "src/main.cc",
        directory = "${WS}",
        output = "${WS}/hello.exe",
        arguments = [
            "cl",
            "/nologo",
            "/EHsc",
            "/DCATTER_TEST=1",
            "/Iinclude",
            "src/main.cc",
            "src/util.cc",
            "/Fehello.exe",
        ],
    },
    {
        file = "src/util.cc",
        directory = "${WS}",
        output = "${WS}/hello.exe",
        arguments = [
            "cl",
            "/nologo",
            "/EHsc",
            "/DCATTER_TEST=1",
            "/Iinclude",
            "src/main.cc",
            "src/util.cc",
            "/Fehello.exe",
        ],
    },
]
