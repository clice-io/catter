[test."$ catter compile-commands -o compile_commands.json --from events.json"]
stdout = "CDB saved to ${WS}/compile_commands.json with 3 entries."
exit = 0

[test."compile_commands.json"]
entries = [
    {
        file = "../c.c",
        directory = "${WS}/sub",
        output = "${WS}/sub/c.s",
        arguments = ["gcc", "-S", "../c.c", "-o", "c.s"],
    },
    { file = "a.c", directory = "${WS}", output = "${WS}/a.o", arguments = ["gcc", "-c", "a.c", "-o", "a.o"] },
    { file = "b.c", directory = "${WS}", arguments = ["gcc", "-E", "b.c", "-o", "b.i"] },
]
