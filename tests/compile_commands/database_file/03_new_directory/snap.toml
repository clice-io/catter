[posix."$ catter compile-commands -o new/dir/compile_commands.json -- c++ -c -DCATTER_TEST=1 -Iinclude src/main.cc -o main.o"]
stdout = "CDB saved to ${WS}/new/dir/compile_commands.json with 1 entries."
exit = 0

[posix."new/dir/compile_commands.json"]
entries = [
    {
        file = "src/main.cc",
        directory = "${WS}",
        output = "${WS}/main.o",
        arguments = ["c++", "-c", "-DCATTER_TEST=1", "-Iinclude", "src/main.cc", "-o", "main.o"],
    },
]

[msvc."$ catter compile-commands -o new/dir/compile_commands.json -- cl /nologo /c /DCATTER_TEST=1 /Iinclude src/main.cc"]
stdout = '''
main.cc
CDB saved to ${WS}/new/dir/compile_commands.json with 1 entries.
'''
exit = 0

[msvc."new/dir/compile_commands.json"]
entries = [
    {
        file = "src/main.cc",
        directory = "${WS}",
        output = "${WS}/main.obj",
        arguments = ["cl", "/nologo", "/c", "/DCATTER_TEST=1", "/Iinclude", "src/main.cc"],
    },
]
