[test."$ catter compile-commands --help -- node -e 0"]
stdout = '''
Generate a compile_commands.json file from captured compiler commands.

Usage:
  catter compile-commands [options] -- <build command>...

Arguments:
  -- <build command>...  The build to run.

Options:
  -o, --output <path>          Write the compilation database to this path.
  --replace                    Ignore existing database entries and replace the output file.
  --save-on-failure            Save collected entries even when the build exits with a non-zero code.
  --abort-on-command-failure   Abort when any captured command exits with a non-zero code.
  --abort-on-capture-error     Abort when catter reports a command capture error.
  -q, --quiet                  Suppress informational output.
  -v, --verbose                Print detailed command analysis and generated entries.
  -C, --directory <path>       The directory the command runs in. [default: the current directory]
  --capture <backend>          How the build's commands are captured: hook, wrapper or ptrace. [default: hook]
  --from <file>                Replay the build recorded in this file instead of running one.
  --handler <command>          Start a handler, which decides or observes the build's commands over its stdin and stdout; may be given more than once.
  --connect <host:port>        Connect to a handler listening at the address, on this machine unless --allow-remote is given; may be given more than once.
  --allow-remote               Let --connect reach a handler on another machine.
  --handler-timeout <seconds>  How long catter waits for a handler to answer, and to exit once the session is over; 0 waits as long as it takes. [default: 60]
  -h, --help                   Print this help message.

Examples:
  catter compile-commands -o build/compile_commands.json -- make
  catter compile-commands --save-on-failure -- ninja
  # Merge existing entries and still save partial results from a failed build.
'''
exit = 0

